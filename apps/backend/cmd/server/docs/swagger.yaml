securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
  ServiceTokenAuth:
    description: Type "Bearer" followed by a space and the shared CONTENT_EXPORT_TOKEN.
      Machine-to-machine export auth, not a user session.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
