name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  backend:
    name: Backend (Go vet + Test + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - run: go vet ./cmd/... ./internal/... ./pkg/...
      - run: go test -count=1 ./...
      - run: go build ./cmd/server

  media-typecheck:
    name: Media Studio TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit

  mobile-typecheck:
    name: Mobile TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  data:
    name: Validate Data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Validate JSON files
        run: |
          shopt -s globstar
          for f in data/json/**/*.json; do
            if ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "Invalid JSON: $f"
              exit 1
            fi
          done
          echo "All JSON files valid"

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
