name: 📦 Dependency Check (Reminder Only)

on:
  schedule:
    # Weekly: Monday 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Check for outdated dependencies
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Check dependencies (root)
        id: check-root
        continue-on-error: true
        run: |
          echo "### 📦 Root" >> $GITHUB_STEP_SUMMARY
          bunx npm-check-updates --target latest --error-level 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/web)
        id: check-web
        continue-on-error: true
        run: |
          echo "### 📦 apps/web" >> $GITHUB_STEP_SUMMARY
          cd apps/web && bunx npm-check-updates --target latest --error-level 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/mobile)
        id: check-mobile
        continue-on-error: true
        run: |
          echo "### 📦 apps/mobile" >> $GITHUB_STEP_SUMMARY
          cd apps/mobile && bunx npm-check-updates --target latest --error-level 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/media)
        id: check-media
        continue-on-error: true
        run: |
          echo "### 📦 apps/media" >> $GITHUB_STEP_SUMMARY
          cd apps/media && bunx npm-check-updates --target latest --error-level 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="📦 Dependency Updates Available"
          ISSUE_BODY="## Dependency Updates Available

          The following outdated dependencies were detected at $(date -u '+%Y-%m-%d %H:%M UTC). Run \`bunx npm-check-updates\` per workspace for details.

          <details>
          <summary>Click to expand full report</summary>

          $(cat $GITHUB_STEP_SUMMARY)

          </details>

          ---
          *This issue is auto-generated by \`dependency-check.yml\` (weekly). **No auto-PR or auto-update is performed.***
          *To check manually: \`bunx npm-check-updates --target latest\` per workspace.*"

          # Check if issue already exists
          EXISTING=$(gh issue list --state open --label "dependencies" --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$(date -u '+%Y-%m-%d %H:%M UTC') — re-checked; see job summary for results."
            gh issue edit "$EXISTING" --add-label "dependencies" 2>/dev/null || true
          else
            echo "Creating new issue"
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label "dependencies" --label "automation"
          fi
