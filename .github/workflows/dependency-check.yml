name: 📦 Dependency Check (Reminder Only)

on:
  schedule:
    # Weekly: Monday 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Check for outdated dependencies
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Check dependencies (root)
        id: check-root
        continue-on-error: true
        run: |
          echo "### 📦 Root" >> $GITHUB_STEP_SUMMARY
          bunx npm-check-updates --target latest 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/web)
        id: check-web
        continue-on-error: true
        run: |
          echo "### 📦 apps/web" >> $GITHUB_STEP_SUMMARY
          cd apps/web && bunx npm-check-updates --target latest 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/mobile)
        id: check-mobile
        continue-on-error: true
        run: |
          echo "### 📦 apps/mobile" >> $GITHUB_STEP_SUMMARY
          cd apps/mobile && bunx npm-check-updates --target latest 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check dependencies (apps/media)
        id: check-media
        continue-on-error: true
        run: |
          echo "### 📦 apps/media" >> $GITHUB_STEP_SUMMARY
          cd apps/media && bunx npm-check-updates --target latest 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="📦 Dependency Updates Available"
          REPORT_PATH="dependency-report-${{ github.run_id }}.md"
          cp $GITHUB_STEP_SUMMARY "$REPORT_PATH" 2>/dev/null || echo "No summary output" > "$REPORT_PATH"

          ISSUE_BODY="## Dependency Updates Available

          Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') · Workflow run: #${{ github.run_id }}

          The following outdated dependencies were detected. **No auto-PR or auto-update is performed** — this is a reminder only.

          To check manually per workspace:
          \`\`\`bash
          bunx npm-check-updates --target latest        # root
          cd apps/web && bunx npm-check-updates --target latest
          cd apps/mobile && bunx npm-check-updates --target latest
          cd apps/media && bunx npm-check-updates --target latest
          \`\`\`

          <details>
          <summary>Click to expand full report</summary>

          $(cat "$REPORT_PATH")

          </details>
          "

          # Check if issue already exists
          EXISTING=$(gh issue list --state open --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
          else
            echo "Creating new issue"
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
          fi
